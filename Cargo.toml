[package]
name = "lyrix"
version = "0.2.0"
edition = "2021"
description = "Synchronized song lyrics in your terminal"

[[bin]]
name = "lyrix"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
